      - cursor
    bundle_url: "https://github.com/a3ip-standard/packages/raw/main/ai-code-review-flow/ai-code-review-flow-v1.5.0.a3ip.bundle"
    versions:
      - version: "1.4.1"
        bundle_path: "ai-code-review-flow/ai-code-review-flow-v1.4.1.a3ip.bundle"
        a3ip_spec: "1.10"
        released: "2026-06-06"
      - version: "1.5.0"
        bundle_path: "ai-code-review-flow/ai-code-review-flow-v1.5.0.a3ip.bundle"
        a3ip_spec: "1.10"
        released: "2026-06-10"

  - name: ai-research-workspace
    description: >
      Research workspace curator. The AI captures papers, logs experiments,
      links them bidirectionally, applies review templates (concise / detailed
      / critical), and synthesizes findings across a structured papers/ +
      experiments/ + syntheses/ directory layout. No external services; all
      state lives as local markdown files with YAML frontmatter under a
      user-configured workspace directory.
    author: "Maksym Prydorozhko <maksym.prydorozhko@gmail.com>"
    license: "Apache-2.0"
    repository: "https://github.com/a3ip-standard/packages"
    latest_version: "1.1.0"
