  - name: ai-code-review-flow
    description: >
      Generic GitLab/GitHub code review workflow. The AI reads a merge/pull
      request diff, applies a structured 7-category review checklist
      (correctness, security, performance, code quality, tests, breaking
      changes, documentation), and posts the review comment via REST API.
      Platform (GitLab/GitHub) and project reference are chosen at install
      time.
    author: "Maksym Prydorozhko <maksym.prydorozhko@gmail.com>"
    license: "Apache-2.0"
    repository: "https://github.com/a3ip-standard/packages"
    latest_version: "1.5.0"
    min_a3ip_spec: "1.10"
    platforms:
